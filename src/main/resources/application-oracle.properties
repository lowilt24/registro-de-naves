# Perfil para correr contra Oracle: ./mvnw spring-boot:run -Dspring-boot.run.profiles=oracle
#
# Pendiente antes de usarlo:
#  1. Agregar al pom la dependencia com.oracle.database.jdbc:ojdbc11 (runtime).
#  2. Agregar org.flywaydb:flyway-database-oracle.
#  3. Reescribir V2/V3 con sintaxis Oracle: GENERATED BY DEFAULT AS IDENTITY
#     existe desde Oracle 12c; BOOLEAN solo desde 23c (en 19c usar NUMBER(1)).
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
