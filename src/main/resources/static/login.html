<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Navesitas</title>
<link rel="preload" href="/css/fuentes/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="barra">
  <h1>Navesitas</h1>
  <span>Registro de naves comerciales &middot; DGMM</span>
</header>

<main class="estrecho">
  <h2>Iniciar sesión</h2>
  <p class="sumario">Acceso para agentes navieros y funcionarios de la DGMM.</p>

  <form class="tarjeta" method="post" action="/api/auth/login" id="form-login">
    <div class="campo">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required autocomplete="username">
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div class="acciones">
      <button type="submit" id="btn-entrar">Entrar</button>
    </div>
    <p class="veredicto" id="aviso-login" role="status"></p>
  </form>

  <p class="nota">
    &iquest;No tiene cuenta? <a href="/registro-usuario.html">Registrarse</a>
  </p>
</main>

<script>
  const parametros = new URLSearchParams(location.search);
  const aviso = document.getElementById('aviso-login');

  if (parametros.has('error')) {
    aviso.dataset.estado = 'ocupado';
    aviso.textContent = 'Correo o contrasena incorrectos.';
  } else if (parametros.has('expirada')) {
    aviso.dataset.estado = 'neutro';
    aviso.textContent = 'Su sesion termino. Vuelva a entrar para continuar.';
  } else if (parametros.has('creado')) {
    aviso.dataset.estado = 'libre';
    aviso.textContent = 'Cuenta creada. Ya puede iniciar sesion.';
  } else if (parametros.has('salida')) {
    aviso.dataset.estado = 'neutro';
    aviso.textContent = 'Sesion cerrada.';
  }
</script>
</body>
</html>
