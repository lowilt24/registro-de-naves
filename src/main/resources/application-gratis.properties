# Render Free: PostgreSQL conserva adjuntos y Brevo envía por HTTPS (no SMTP).
# Activar solo SPRING_PROFILES_ACTIVE=gratis; no combinar con prod.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
navesitas.url-base=${NAVESITAS_URL_BASE}
navesitas.almacen.tipo=postgres
navesitas.correo.transporte=brevo
navesitas.correo.api-key=${BREVO_API_KEY}
navesitas.correo.remitente=${CORREO_REMITENTE}
navesitas.correo.enlaces-en-log=false
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
