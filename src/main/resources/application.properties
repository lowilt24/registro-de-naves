spring.application.name=registro-naves

# ---------------------------------------------------------------
# Base de datos de desarrollo: H2 en archivo, para que los datos
# sobrevivan al reinicio y sirvan de evidencia en la demo.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/navesitas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway manda sobre el esquema; Hibernate solo valida que coincida.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No devolver detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
