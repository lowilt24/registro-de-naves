spring.application.name=registro-naves

# ---------------------------------------------------------------
# Base de datos: PostgreSQL de docker-compose.yml
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/registro_naves
spring.datasource.username=registro
spring.datasource.password=registro




# Flyway manda sobre el esquema; Hibernate solo valida que coincida.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V3_1 (arreglo de MIG-01) tiene que poder correr en bases que ya estan en
# la V4 o mas. Es idempotente: en esas bases no hace nada.
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No devolver detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------
# Sprint 4 — carga de documentos (HU-07)
#
# El limite de negocio es 10 MB y lo verifica DocumentoService, que
# responde 413 con un mensaje claro. El tope del servlet queda mas arriba
# a proposito: si fuera 10 MB exactos, el rechazo ocurriria antes de
# llegar al servicio. Y Tomcat, cuando rechaza una carga de mas de
# max-swallow-size (2 MB por defecto), corta la conexion sin responder,
# asi que el cliente veria "conexion reiniciada" en vez de 413.
# ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
server.tomcat.max-swallow-size=20MB

# Carpeta de los PDF. Relativa a donde se arranca la aplicacion (la raiz
# del proyecto con mvnw). Esta fuera de static/: no tiene URL.
navesitas.almacen.ruta=almacen

# ---------------------------------------------------------------
# Sprint 4 — correo de validacion al registrarse
#
# En desarrollo el SMTP es Mailpit (docker-compose.yml): recibe todo y lo
# muestra en http://localhost:8025, sin mandar nada afuera. Para un
# servidor real se cambian host, puerto y credenciales. Si se borra
# spring.mail.host, el enlace se escribe en la consola.
# ---------------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
navesitas.correo.remitente=no-responder@navesitas.pa
# Base de los enlaces que van en el correo.
navesitas.url-base=http://localhost:8080
