spring.application.name=registro-naves

# ---------------------------------------------------------------
# Base de datos de desarrollo: H2 en archivo, para que los datos
# sobrevivan al reinicio y sirvan de evidencia en la demo.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/registro_naves
spring.datasource.username=registro
spring.datasource.password=registro




# Flyway manda sobre el esquema; Hibernate solo valida que coincida.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No devolver detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
