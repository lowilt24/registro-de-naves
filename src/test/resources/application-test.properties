# Las pruebas corren contra la misma base de PostgreSQL que el desarrollo.
# Cada clase de prueba lleva @Transactional, asi que lo que inserta se
# deshace al terminar. Sin eso, la segunda corrida de mvnw verify fallaba
# porque las naves creadas en la primera seguian existiendo.
spring.datasource.url=jdbc:postgresql://localhost:5432/registro_naves
spring.datasource.username=registro
spring.datasource.password=registro
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
